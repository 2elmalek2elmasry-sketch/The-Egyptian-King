<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout — THE EGYPTIAN KING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#fff; --text-main:#0a0a0a; --text-muted:#666; --accent:#bfa15f; --border:#e5e5e5; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        body { background:var(--bg); color:var(--text-main); overflow-x:hidden; width:100%; }
        .toast-container { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:1rem; align-items:center; pointer-events:none; max-width:90%; }
        .toast-message { background:#0a0a0a; color:#fff; padding:1rem 2.5rem; border-radius:4px; font-weight:600; font-size:0.9rem; box-shadow:0 10px 30px rgba(0,0,0,0.2); opacity:0; transform:translateY(20px); transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); text-align:center; word-wrap:break-word; }
        .toast-message.show { opacity:1; transform:translateY(0); }
        header { background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:1.25rem clamp(1rem,5vw,4rem); position:sticky; top:0; z-index:100; display:flex; justify-content:center; align-items:center; }
        .brand-logo { font-family:'Cinzel',serif; font-size:clamp(1.2rem,3vw,1.6rem); font-weight:900; letter-spacing:2px; color:#0a0a0a; text-decoration:none; text-transform:uppercase; }
        .checkout-layout { display:grid; grid-template-columns:1fr 400px; gap:3rem; max-width:1300px; margin:0 auto; padding:3rem clamp(1rem,5vw,4rem); }
        .section-box { margin-bottom:2rem; }
        .section-title { font-size:1.2rem; font-weight:800; margin-bottom:1.5rem; text-transform:uppercase; letter-spacing:1px; }
        .form-group { margin-bottom:1rem; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        .input-field { width:100%; background:#fff; border:1px solid var(--border); border-radius:4px; padding:0.9rem 1rem; color:#0a0a0a; font-size:0.9rem; outline:none; transition:border-color 0.2s; }
        .input-field:focus { border-color:#0a0a0a; }
        .btn-complete { width:100%; background:#0a0a0a; color:#fff; padding:1.2rem; border:none; border-radius:4px; font-weight:800; font-size:0.9rem; text-transform:uppercase; letter-spacing:1px; cursor:pointer; margin-top:1rem; transition:background 0.3s; }
        .btn-complete:hover { background:var(--accent); }
        .sidebar { background:#fafafa; padding:2rem; border-radius:8px; border:1px solid var(--border); height:fit-content; }
        .summary-item { display:flex; gap:1rem; margin-bottom:1.5rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border); }
        .summary-item img { width:60px; height:70px; object-fit:cover; border-radius:4px; }
        .summary-item h4 { font-size:0.9rem; font-weight:700; margin-bottom:0.2rem; }
        .summary-item p { font-size:0.8rem; color:var(--text-muted); }
        .cost-row { display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.9rem; }
        .cost-row.total { font-size:1.2rem; font-weight:800; color:#0a0a0a; border-top:1px solid var(--border); padding-top:1rem; margin-top:1rem; }
        @media (max-width:900px) { .checkout-layout { grid-template-columns:1fr; } .form-row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="toast-container"></div>
    <header><a href="index.html" class="brand-logo">The Egyptian King</a></header>
    <div class="checkout-layout">
        <div>
            <div class="section-box">
                <h2 class="section-title">Contact Information</h2>
                <div class="form-group"><input type="email" class="input-field" placeholder="Email address" required></div>
            </div>
            <div class="section-box">
                <h2 class="section-title">Shipping Address</h2>
                <div class="form-row">
                    <div class="form-group"><input type="text" class="input-field" placeholder="First name" required></div>
                    <div class="form-group"><input type="text" class="input-field" placeholder="Last name" required></div>
                </div>
                <div class="form-group"><input type="text" class="input-field" placeholder="Address" required></div>
                <div class="form-row">
                    <div class="form-group"><input type="text" class="input-field" placeholder="City" required></div>
                    <div class="form-group"><input type="text" class="input-field" placeholder="Postal code (optional)"></div>
                </div>
                <div class="form-group"><input type="text" class="input-field" placeholder="Phone number" required></div>
            </div>
            <div class="section-box">
                <h2 class="section-title">Payment</h2>
                <div style="border:1px solid var(--border); padding:1.5rem; border-radius:4px; background:#fff;">
                    <p style="font-weight:700; margin-bottom:1rem;">Cash on Delivery (COD)</p>
                    <p style="font-size:0.85rem; color:var(--text-muted);">Pay with cash upon delivery.</p>
                </div>
            </div>
            <button class="btn-complete" onclick="completeOrder()">Place Order</button>
        </div>
        <div class="sidebar">
            <h2 class="section-title">Order Summary</h2>
            <div id="checkout-items-list"></div>
            <div class="cost-row"><span>Subtotal</span><span id="subtotal-val">E£0.00</span></div>
            <div class="cost-row"><span>Shipping</span><span>Free</span></div>
            <div class="cost-row total"><span>Total</span><span id="total-val">E£0.00</span></div>
        </div>
    </div>
    <script>
        function showToast(message) {
            let container = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = message;
            container.appendChild(toast);
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { toast.remove(); }, 400); }, 3000);
        }
        function loadCheckout() {
            const cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            const listContainer = document.getElementById('checkout-items-list');
            let subtotal = 0;
            if (cart.length === 0) {
                listContainer.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">No items selected for checkout.</p>`;
                return;
            }
            listContainer.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                return `
                    <div class="summary-item">
                        <img src="${item.img}" alt="${item.name}">
                        <div style="flex:1;">
                            <h4>${item.name}</h4>
                            <p>Qty: ${item.qty}</p>
                            <p style="color:#0a0a0a; font-weight:700; margin-top:4px;">E£${itemTotal.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('subtotal-val').innerText = `E£${subtotal.toFixed(2)}`;
            document.getElementById('total-val').innerText = `E£${subtotal.toFixed(2)}`;
        }
        function completeOrder() {
            showToast('Order placed successfully! Thank you.');
            localStorage.removeItem('kingCart');
            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
        }
        window.addEventListener('DOMContentLoaded', () => { loadCheckout(); });
    </script>
</body>
</html>
