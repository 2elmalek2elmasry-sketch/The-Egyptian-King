<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopping Bag — THE EGYPTIAN KING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#fff; --text-main:#0a0a0a; --text-muted:#666; --accent:#bfa15f; --border:#e5e5e5; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        body { background:var(--bg); color:var(--text-main); overflow-x:hidden; width:100%; }
        .toast-container { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:1rem; align-items:center; pointer-events:none; max-width:90%; }
        .toast-message { background:#0a0a0a; color:#fff; padding:1rem 2.5rem; border-radius:4px; font-weight:600; font-size:0.9rem; box-shadow:0 10px 30px rgba(0,0,0,0.2); opacity:0; transform:translateY(20px); transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); text-align:center; word-wrap:break-word; }
        .toast-message.show { opacity:1; transform:translateY(0); }
        .announce-bar { background:#0a0a0a; color:#fff; padding:10px 0; text-align:center; font-size:0.75rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; }
        header { background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:1.25rem clamp(1rem,5vw,4rem); position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
        .brand-logo { font-family:'Cinzel',serif; font-size:clamp(1.2rem,3vw,1.6rem); font-weight:900; letter-spacing:2px; color:#0a0a0a; text-decoration:none; text-transform:uppercase; }
        nav ul { display:flex; list-style:none; gap:clamp(1rem,3vw,2.5rem); flex-wrap:wrap; }
        nav a { color:var(--text-main); text-decoration:none; font-size:0.85rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; transition:color 0.3s; }
        nav a:hover, nav a.active { color:var(--accent); }
        .nav-actions { display:flex; gap:1.5rem; align-items:center; }
        .icon-btn { background:none; border:none; cursor:pointer; font-size:1.2rem; color:#0a0a0a; position:relative; text-decoration:none; }
        .cart-count { position:absolute; top:-5px; right:-8px; background:var(--accent); color:#fff; font-size:0.6rem; font-weight:800; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .cart-layout { display:grid; grid-template-columns:2fr 1fr; gap:3rem; max-width:1300px; margin:0 auto; padding:3rem clamp(1rem,5vw,4rem); }
        .page-title { font-family:'Cinzel',serif; font-size:clamp(1.8rem,4vw,2.5rem); margin-bottom:2rem; border-bottom:1px solid var(--border); padding-bottom:1rem; }
        .cart-item { display:flex; gap:1.5rem; padding:1.5rem 0; border-bottom:1px solid var(--border); }
        .cart-img { width:100px; height:120px; border-radius:6px; object-fit:cover; background:#f5f5f5; }
        .cart-info { flex:1; }
        .cart-info h3 { font-size:1rem; font-weight:700; margin-bottom:0.5rem; }
        .cart-price { font-size:0.9rem; color:var(--text-muted); font-weight:600; margin-bottom:1rem; }
        .qty-controls { display:inline-flex; align-items:center; gap:1rem; border:1px solid var(--border); border-radius:4px; padding:0.2rem 0.8rem; }
        .qty-btn { background:none; border:none; font-size:1rem; font-weight:800; cursor:pointer; color:#0a0a0a; }
        .btn-remove { background:none; border:none; color:#ff0000; font-size:0.8rem; font-weight:600; cursor:pointer; margin-top:1rem; text-transform:uppercase; letter-spacing:1px; }
        .cart-summary { background:#fafafa; padding:2rem; border-radius:8px; border:1px solid var(--border); height:fit-content; }
        .summary-row { display:flex; justify-content:space-between; margin-bottom:1rem; font-size:0.9rem; }
        .summary-row.total { font-size:1.5rem; font-weight:800; color:#0a0a0a; border-top:1px solid var(--border); padding-top:1rem; margin-top:1rem; }
        .btn-checkout { width:100%; background:#0a0a0a; color:#fff; padding:1rem; border:none; border-radius:4px; font-weight:700; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; cursor:pointer; margin-top:1.5rem; transition:background 0.3s; }
        .btn-checkout:hover { background:var(--accent); }
        .empty-state { text-align:center; padding:4rem 1rem; }
        .empty-state h2 { font-family:'Cinzel',serif; font-size:1.5rem; margin-bottom:1rem; }
        .empty-state a { display:inline-block; margin-top:1rem; background:#0a0a0a; color:#fff; padding:1rem 2rem; text-decoration:none; font-weight:700; font-size:0.85rem; text-transform:uppercase; border-radius:4px; }
        footer { background:#0a0a0a; color:#fff; padding:2rem; text-align:center; margin-top:4rem; }
        .footer-bottom { color:#666; font-size:0.8rem; }
        @media (max-width:768px) { .cart-layout { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="toast-container"></div>
    <div class="announce-bar">🚚 FREE WORLDWIDE SHIPPING ON ORDERS OVER $100 • NEW PHARAOH DROP LIVE NOW</div>
    <header>
        <a href="index.html" class="brand-logo">The Egyptian King</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="reviews.html">Reviews</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <a href="cart.html" class="icon-btn">🛍️ <span class="cart-count" id="cart-count">0</span></a>
        </div>
    </header>
    <div class="cart-layout">
        <div>
            <h1 class="page-title">Your Shopping Bag</h1>
            <div id="cart-container"></div>
        </div>
        <div>
            <div class="cart-summary" id="summary-box" style="display:none;">
                <div class="summary-row"><span>Subtotal</span><span id="subtotal-val">E£0.00</span></div>
                <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
                <div class="summary-row total"><span>Total</span><span id="total-val">E£0.00</span></div>
                <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>
    <footer><div class="footer-bottom">&copy; 2026 THE EGYPTIAN KING. All rights reserved.</div></footer>
    <script>
        function showToast(message) {
            let container = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = message;
            container.appendChild(toast);
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { toast.remove(); }, 400); }, 3000);
        }
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            const container = document.getElementById('cart-container');
            const summaryBox = document.getElementById('summary-box');
            if (!cart || cart.length === 0) {
                container.innerHTML = `<div class="empty-state"><h2>Your bag is empty</h2><p>Explore our collection to add exclusive apparel.</p><a href="shop.html">Continue Shopping</a></div>`;
                summaryBox.style.display = 'none';
                return;
            }
            summaryBox.style.display = 'block';
            let subtotal = 0;
            container.innerHTML = cart.map((item, index) => {
                const itemPrice = Number(item.price) || 0;
                const itemQty = Number(item.qty) || 1;
                subtotal += itemPrice * itemQty;
                return `
                    <div class="cart-item">
                        <img src="${item.img}" alt="${item.name}" class="cart-img">
                        <div class="cart-info">
                            <h3>${item.name}</h3>
                            <p class="cart-price">E£${itemPrice.toFixed(2)}</p>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <span>${itemQty}</span>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                            <br>
                            <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('subtotal-val').innerText = `E£${subtotal.toFixed(2)}`;
            document.getElementById('total-val').innerText = `E£${subtotal.toFixed(2)}`;
        }
        function changeQty(index, delta) {
            let cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            if (!cart[index]) return;
            cart[index].qty = (cart[index].qty || 1) + delta;
            if (cart[index].qty <= 0) { cart.splice(index, 1); showToast('Item removed from bag.'); }
            localStorage.setItem('kingCart', JSON.stringify(cart));
            renderCart(); updateCartCount();
        }
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('kingCart', JSON.stringify(cart));
            renderCart(); updateCartCount();
            showToast('Item removed from bag.');
        }
        function checkout() {
            showToast('Redirecting to secure checkout...');
            setTimeout(() => { window.location.href = 'checkout.html'; }, 1000);
        }
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            document.getElementById('cart-count').innerText = count;
        }
        window.addEventListener('DOMContentLoaded', () => { renderCart(); updateCartCount(); });
    </script>
</body>
</html>
