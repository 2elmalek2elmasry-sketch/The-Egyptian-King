        body { background:var(--bg); color:var(--text-main); overflow-x:hidden; width:100%; }
        .toast-container { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:1rem; align-items:center; pointer-events:none; max-width:90%; }

        .toast-message.show { opacity:1; transform:translateY(0); }
        .announce-bar { background:#0a0a0a; color:#fff; padding:10px 0; text-align:center; font-size:0.75rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; }

        .brand-logo { font-family:'Cinzel',serif; font-size:clamp(1.2rem,3vw,1.6rem); font-weight:900; letter-spacing:2px; color:#0a0a0a; text-decoration:none; text-transform:uppercase; }
        nav ul { display:flex; list-style:none; gap:clamp(1rem,3vw,2.5rem); flex-wrap:wrap; }
        nav a { color:var(--text-main); text-decoration:none; font-size:0.85rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; transition:color 0.3s; }
        nav a:hover, nav a.active { color:var(--accent); }
        .nav-actions { display:flex; gap:1.5rem; align-items:center; }
        .icon-btn { background:none; border:none; cursor:pointer; font-size:1.2rem; color:#0a0a0a; position:relative; text-decoration:none; }
        .cart-count { position:absolute; top:-5px; right:-8px; background:var(--accent); color:#fff; font-size:0.6rem; font-weight:800; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .page-header { padding:4rem 2rem 2rem; text-align:center; border-bottom:1px solid var(--border); }
        .page-header h1 { font-family:'Cinzel',serif; font-size:clamp(2rem,5vw,3.5rem); margin-bottom:1rem; }
        .breadcrumb { font-size:0.8rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
        .breadcrumb a { color:var(--text-muted); text-decoration:none; }
        .toolbar { display:flex; justify-content:space-between; align-items:center; padding:2rem clamp(1rem,5vw,4rem); border-bottom:1px solid var(--border); }
        .filter-btn { background:none; border:1px solid var(--border); padding:0.6rem 1.2rem; border-radius:4px; font-weight:600; cursor:pointer; font-size:0.85rem; }
        .product-count { color:var(--text-muted); font-size:0.85rem; font-weight:500; }
        .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:2.5rem; padding:3rem clamp(1rem,5vw,4rem); max-width:1400px; margin:0 auto; }
        .product-card { text-decoration:none; color:inherit; display:flex; flex-direction:column; cursor:pointer; }
        .product-img-wrapper { position:relative; width:100%; aspect-ratio:1/1.2; background:#f5f5f5; border-radius:6px; overflow:hidden; margin-bottom:1rem; }
        .product-img-wrapper img { width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease; }
        .product-card:hover .product-img-wrapper img { transform:scale(1.05); }
        .quick-add { position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.95); backdrop-filter:blur(5px); padding:1rem; text-align:center; font-weight:700; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; transform:translateY(100%); transition:transform 0.3s ease; border-top:1px solid var(--border); }
        .product-card:hover .quick-add { transform:translateY(0); }
        .product-info { padding:0 0.5rem; }
        .product-title { font-size:0.95rem; font-weight:700; margin-bottom:0.3rem; }
        .product-price { font-size:0.9rem; color:var(--text-main); font-weight:600; }
        .star-rating { font-size:0.75rem; margin-bottom:0.3rem; color:#0a0a0a; }
        .star-rating span { color:var(--text-muted); margin-left:4px; }
        footer { background:#0a0a0a; color:#fff; padding:4rem 2rem 2rem; margin-top:4rem; }
        .footer-bottom { border-top:1px solid #333; padding-top:2rem; text-align:center; color:#666; font-size:0.8rem; }
        @media (max-width:768px) { .toolbar { flex-direction:column; gap:1rem; } }

        function getStars(rating) {
            let r = Math.round(rating);
            return '★'.repeat(r) + '☆'.repeat(5 - r);
        }
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card" onclick="addToCart(${p.id})">
                    <div class="product-img-wrapper">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="quick-add">+ Quick Add to Bag</div>
                    </div>
                    <div class="product-info">
                        <div class="star-rating">${getStars(p.rating)} <span>(${p.reviews})</span></div>
                        <h3 class="product-title">${p.name}</h3>
                        <p class="product-price">E£${p.price}.00 EGP</p>
                    </div>
                </div>
            `).join('');
            document.getElementById('product-count').innerText = `${products.length} Products`;
        }
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            let cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty = (existing.qty || 1) + 1; } else { cart.push({ ...product, qty: 1 }); }
            localStorage.setItem('kingCart', JSON.stringify(cart));
            updateCartCount();
            showToast(`${product.name} added to bag!`);
        }
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            document.getElementById('cart-count').innerText = count;
        }
        window.addEventListener('DOMContentLoaded', () => { renderProducts(); updateCartCount(); });
