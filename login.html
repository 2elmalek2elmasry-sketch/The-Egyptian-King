<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login — THE EGYPTIAN KING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#ffffff; --bg-alt:#faf9f7; --text-main:#0a0a0a; --text-muted:#6b6b6b;
            --accent:#bfa15f; --border:#e8e6e1; --btn-bg:#0a0a0a;
        }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
        html { scroll-behavior:smooth; -webkit-text-size-adjust: 100%; }
        body { background:var(--bg-alt); color:var(--text-main); overflow-x:hidden; width:100%; min-height: 100vh; display:flex; flex-direction:column; }
        a { text-decoration: none; color: inherit; }

        header { background:rgba(255,255,255,0.98); border-bottom:1px solid var(--border); padding:1.1rem clamp(1.2rem,5vw,3.5rem); display:flex; justify-content:center; align-items:center; position: sticky; top: 0; z-index: 100; }
        .logo-img { height: 26px; width: auto; object-fit: contain; }

        .login-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 4rem 1.25rem; }
        .login-card { background: #fff; border: 1px solid var(--border); padding: 3rem 2.5rem; border-radius: 4px; width: 100%; max-width: 420px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); }
        .login-card h1 { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 900; text-align: center; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; }
        .login-subtitle { text-align: center; color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 2.5rem; text-transform: uppercase; }

        .toggle-row { display: flex; border: 1px solid var(--border); border-radius: 2px; margin-bottom: 2rem; }
        .toggle-btn { flex: 1; padding: 0.85rem; background: none; border: none; font-weight: 700; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; color: var(--text-muted); transition: all 0.3s; }
        .toggle-btn.active { background: var(--text-main); color: #fff; }

        .form-group { margin-bottom: 1.25rem; }
        .input-field { width: 100%; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: 2px; font-size: 0.85rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.3s; background: var(--bg-alt); }
        .input-field:focus { border-color: var(--text-main); background: #fff; }

        .btn-primary { width: 100%; background: var(--btn-bg); color: #fff; padding: 1.1rem 2.5rem; border: 1px solid var(--btn-bg); border-radius: 2px; font-weight: 700; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.35s ease; margin-top: 0.5rem; }
        .btn-primary:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }

        .divider { display: flex; align-items: center; text-align: center; margin: 2rem 0; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--border); }
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }

        .google-btn { width: 100%; background: #fff; color: var(--text-main); border: 1px solid var(--border); padding: 1.1rem 2.5rem; border-radius: 2px; font-weight: 700; font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .google-btn:hover { background: #f5f5f5; }

        .toast-container { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:1rem; align-items:center; pointer-events:none; max-width:90%; }
        .toast-message { background:#0a0a0a; color:#fff; padding:1rem 2.5rem; border-radius:2px; font-weight:600; font-size:0.85rem; border-left:3px solid var(--accent); opacity:0; transform:translateY(20px); transition:all 0.4s ease; }
        .toast-message.show { opacity:1; transform:translateY(0); }
    </style>
</head>
<body>
    <header><a href="index.html"><img src="https://i.postimg.cc/N0g8X9mx/logo-words-transparent.png" alt="The Egyptian King" class="logo-img"></a></header>

    <div class="toast-container"></div>

    <div class="login-container">
        <div class="login-card">
            <h1>Welcome</h1>
            <p class="login-subtitle">Join The Egyptian Kingdom</p>

            <div class="toggle-row">
                <button class="toggle-btn active" id="login-tab" onclick="switchTab('login')">Sign In</button>
                <button class="toggle-btn" id="signup-tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group"><input type="email" id="login-email" class="input-field" placeholder="Email Address" required></div>
                <div class="form-group"><input type="password" id="login-password" class="input-field" placeholder="Password" required></div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signup-form" style="display:none;" onsubmit="handleSignup(event)">
                <div class="form-group"><input type="text" id="signup-name" class="input-field" placeholder="Full Name" required></div>
                <div class="form-group"><input type="email" id="signup-email" class="input-field" placeholder="Email Address" required></div>
                <div class="form-group"><input type="password" id="signup-password" class="input-field" placeholder="Create Password (min 6 chars)" required></div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="divider">OR</div>

            <button class="google-btn" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOtDF71w3oXICE04c9CGtz_prRHBnMq6c",
            authDomain: "the-egyptian-king-68e45.firebaseapp.com",
            projectId: "the-egyptian-king-68e45",
            storageBucket: "the-egyptian-king-68e45.firebasestorage.app",
            messagingSenderId: "94881816710",
            appId: "1:94881816710:web:10fca569f1b43c583ab107",
            measurementId: "G-ZR0FBN0PRV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showToast(message) {
            let container = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = message;
            container.appendChild(toast);
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('login-tab').classList.add('active');
                document.getElementById('signup-tab').classList.remove('active');
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
                document.getElementById('login-tab').classList.remove('active');
                document.getElementById('signup-tab').classList.add('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(userCredential => {
                    showToast("Welcome back, King! 👑");
                    setTimeout(() => window.location.href = 'index.html', 1000);
                })
                .catch(err => showToast(err.message));
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;

            auth.createUserWithEmailAndPassword(email, pass)
                .then(userCredential => {
                    // Save name to profile
                    return userCredential.user.updateProfile({ displayName: name });
                })
                .then(() => {
                    // Create user doc in DB
                    const user = auth.currentUser;
                    return db.collection('users').doc(user.uid).set({
                        name: name,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    showToast("Account created successfully! 👑");
                    setTimeout(() => window.location.href = 'index.html', 1000);
                })
                .catch(err => showToast(err.message));
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(result => {
                    const user = result.user;
                    // Create user doc if new
                    db.collection('users').doc(user.uid).set({
                        name: user.displayName,
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    
                    showToast("Welcome, King! 👑");
                    setTimeout(() => window.location.href = 'index.html', 1000);
                })
                .catch(err => showToast(err.message));
        }
    </script>
</body>
</html>
